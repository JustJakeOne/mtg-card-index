# .github/workflows/refresh-card-index.yml
name: Refresh card index

on:
  schedule:
    - cron: "17 11 * * *"        # 11:17 UTC. Off the hour on purpose.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build cards, printings, tags, game changers
        run: |
          python scripts/build_card_index.py \
            --bulk default_cards \
            --out cards.csv \
            --printings-out printings.csv \
            --min-cards 25000 \
            --min-printings 80000
          python scripts/build_oracle_tags.py --out oracle_tags.csv
          python scripts/build_game_changers.py --out game_changers.json
          gzip -9 -f cards.csv printings.csv oracle_tags.csv

      - name: Publish to data branch (preserve combos and rules)
        run: |
          python scripts/publish_data_branch.py \
            --own cards.csv.gz printings.csv.gz oracle_tags.csv.gz game_changers.json BUILD_INFO.txt \
            --message "card index $(date -u +%Y-%m-%d)"
