# .github/workflows/refresh-combos.yml
name: Refresh Spellbook combos

on:
  schedule:
    - cron: "23 5 * * 1"         # weekly Monday 05:23 UTC; off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take cards.csv.gz from data branch
        run: git fetch origin data && git checkout origin/data -- cards.csv.gz

      - name: Mirror Spellbook dump and Comprehensive Rules
        run: |
          python scripts/build_combos.py --cards cards.csv.gz --out combos.jsonl
          python scripts/fetch_comp_rules.py --out MagicCompRules.txt

      - name: Publish to data branch (preserve card files)
        run: |
          python scripts/publish_data_branch.py \
            --own combos.jsonl MagicCompRules.txt BUILD_INFO.txt \
            --message "combos $(date -u +%Y-%m-%d)"
